
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ARCOTECH GOLDEN MASTER</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D4AF37">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
            --gold-primary: #D4AF37;
            --gold-deep: #B8860B;
            --gold-light: #FDFCF0;
            --cyan-tech: #00E5FF;
        }
        
        * { -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #FFFFFF;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.03) 0%, transparent 80%),
                linear-gradient(rgba(212, 175, 55, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 175, 55, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            position: fixed;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        .mono { font-family: 'Space Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            height: 32px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #FDFCF0, #EAE4B5);
            border-radius: 4px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 12px;
            background: var(--gold-primary);
            cursor: pointer;
            margin-top: -11px;
            border-radius: 2px;
            border: 1px solid #FFF;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            transition: transform 0.2s;
        }
        input[type=range]:active::-webkit-slider-thumb {
            transform: scaleX(1.5);
            background: var(--cyan-tech);
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 0.1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 2px;
            background: var(--gold-primary);
            box-shadow: 0 0 20px var(--gold-primary);
            animation: scanline 8s linear infinite;
            pointer-events: none;
            z-index: 50;
        }

        .gold-glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "jszip": "https://esm.sh/jszip@^3.10.1"
  }
}
</script>
</head>
<body>
    <div class="scanline"></div>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
</body>
</html>
